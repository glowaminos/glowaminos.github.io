<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | Glow Aminos</title><meta name="description" content="Review your Glow Aminos cart and shipping details."><meta name="robots" content="noindex,follow"><meta property="og:title" content="Checkout | Glow Aminos"><meta property="og:type" content="website"><link rel="icon" type="image/png" href="assets/images/favicon.png"><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/atelier.css"></head><body><div data-site-header></div><main><section class="page-hero"><div class="container"><p class="kicker">YOUR ORDER / CHECKOUT</p><h1 class="title">Checkout</h1><p class="lead">Review your information before continuing to a secure payment provider.</p></div></section><section class="section" style="padding-top:0"><div class="container cart-layout"><div><div class="checkout-steps" aria-label="Checkout steps"><span class="active">01 Contact</span><span>02 Shipping</span><span>03 Review</span></div><div data-checkout-setup role="status" class="checkout-setup hidden"></div><form data-checkout-form novalidate><fieldset data-step="0"><legend>Contact information</legend><div class="form-grid"><div class="field"><label for="first-name">First name</label><input class="input" id="first-name" name="firstName" required autocomplete="given-name"></div><div class="field"><label for="last-name">Last name</label><input class="input" id="last-name" name="lastName" required autocomplete="family-name"></div><div class="field full"><label for="email">Email</label><input class="input" id="email" name="email" type="email" required autocomplete="email"></div></div><button type="button" class="btn checkout-next" data-next>Continue to shipping</button></fieldset><fieldset data-step="1" hidden><legend>Shipping details</legend><div class="form-grid"><div class="field full"><label for="address">Street address</label><input class="input" id="address" name="address" required autocomplete="street-address"></div><div class="field"><label for="city">City</label><input class="input" id="city" name="city" required autocomplete="address-level2"></div><div class="field"><label for="region">State / region</label><input class="input" id="region" name="region" required autocomplete="address-level1"></div><div class="field"><label for="postal-code">Postal code</label><input class="input" id="postal-code" name="postalCode" required autocomplete="postal-code"></div><div class="field"><label for="country">Country</label><input class="input" id="country" name="country" required autocomplete="country-name"></div></div><div class="checkout-nav"><button type="button" class="btn secondary" data-back>Back</button><button type="button" class="btn" data-next>Review order</button></div></fieldset><fieldset data-step="2" hidden><legend>Review and confirm</legend><div data-review-contact></div><label class="checkout-ack"><input type="checkbox" name="researchAck" required> I confirm these products are for laboratory research use only, and I am at least 21.</label><div class="checkout-nav"><button type="button" class="btn secondary" data-back>Back</button><button type="submit" class="btn">Continue to secure payment</button></div></fieldset><div data-checkout-status class="form-status" role="status" aria-live="polite"></div></form></div><aside class="summary-card"><h2>Order summary</h2><div data-checkout-summary></div><p class="muted">Shipping is calculated by the connected checkout service.</p></aside></div></section></main><div data-site-footer></div><script type="module" src="assets/js/main.js"></script><script type="module" src="assets/js/checkout.js"></script></body></html>
