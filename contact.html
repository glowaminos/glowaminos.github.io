<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact | Research Catalog</title><meta name="description" content="Contact support."><meta name="robots" content="index,follow"><meta property="og:title" content="Contact | Research Catalog"><meta property="og:description" content="Contact support."><meta property="og:type" content="website"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="assets/css/site.css"></head><body ><div data-site-header></div><main><section class="page-hero"><div class="container"><div class="eyebrow">Support</div><h1 class="title">Contact</h1><p class="lead">The form is ready for a real endpoint and does not display a fake success state while disconnected.</p></div></section><section class="section" style="padding-top:0"><div class="container"><form class="form-grid" data-contact-form style="max-width:760px"><div class="field"><label>First name</label><input class="input" name="firstName" required></div><div class="field"><label>Last name</label><input class="input" name="lastName" required></div><div class="field full"><label>Email</label><input class="input" type="email" name="email" required></div><div class="field"><label>Order number <span class="muted">optional</span></label><input class="input" name="orderNumber"></div><div class="field"><label>Subject</label><input class="input" name="subject" required></div><div class="field full"><label>Message</label><textarea class="input" name="message" rows="6" required></textarea></div><div class="field full"><button class="btn">Send message</button><div data-contact-status class="form-status"></div></div></form></div></section></main><div data-site-footer></div><script type="module" src="assets/js/main.js"></script><script type="module" src="assets/js/forms.js"></script></body></html>
